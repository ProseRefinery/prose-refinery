<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630, initial-scale=1.0">
    <title>OG V25 (Debug Red + Forced Ligatures)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ff0000 !important;
            /* V25: Red debug background */
            font-family: 'Inter', sans-serif;
            border: none !important;
            user-select: none;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: -20px;
        }

        .icon-wrapper {
            height: 320px;
            width: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-wrapper img {
            height: 100%;
            width: auto;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 88px;
            font-weight: 700;
            color: #007F57;
            margin: 0;
            line-height: 1.0;
            letter-spacing: normal;
            font-variant-ligatures: common-ligatures contextual;
            /* Force ligatures */
            word-spacing: 0.2em;
        }

        .tagline {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #292929;
            margin-top: 8px;
            letter-spacing: 0.05em;
            opacity: 0.95;
        }

        /* The Mask to hide blue border artifacts */
        .mask-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 50px white inset border covers the browser artifact */
            box-shadow: inset 0 0 0 50px #ffffff;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="mask-overlay"></div>
    <div class="container">
        <div class="icon-wrapper">
            <!-- Referencing the clean vector icon -->
            <img src="favicon.svg" alt="Prose Refinery Icon">
        </div>
        <h1 class="title">Prose Refinery</h1>
        <p class="tagline">Precision Editorial for Speculative Fiction</p>
    </div>
</body>

</html>
